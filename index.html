<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bikeRouteriOS</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d100b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9ebe3" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bikeRouter">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div id="map" aria-label="Karte"></div>

  <!-- Oben links: das Profil. Oben rechts: der Nutzer. Siehe CLAUDE.md. -->
  <div class="chrome">
    <button class="pill" id="pillBtn" type="button" aria-haspopup="true">
      <span class="dot"></span><b id="pillName">Wenig Verkehr</b><span class="chev" aria-hidden="true">▾</span>
    </button>
    <span class="spacer"></span>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menü">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <div class="rail" id="rail">
    <button class="iconbtn on" id="mPoint" type="button" aria-pressed="true" aria-label="Wegpunkt-Modus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
    </button>
    <button class="iconbtn" id="mNogo" type="button" aria-pressed="false" aria-label="Sperrbereich-Modus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/></svg>
    </button>
    <button class="iconbtn" id="mUndo" type="button" aria-label="Letzte Aktion zurücknehmen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="iconbtn" id="mLoc" type="button" aria-label="Auf meinen Standort zentrieren">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="7.6"/><path d="M12 1.6v2.8M12 19.6v2.8M1.6 12h2.8M19.6 12h2.8"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Unten: die Route -->
  <section class="sheet" data-detent="peek" id="sheet" aria-label="Route">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Blatt öffnen"><span></span></div>
    <div class="sheetscroll">

      <div>
        <div class="eyebrow" id="sheetProfile">Wenig Verkehr</div>
        <div class="readout" id="readout" hidden>
          <div class="big num" id="rDist">–</div>
          <div class="sep"></div>
          <div class="big num" id="rAsc">–</div>
          <div class="sep"></div>
          <div class="big num" id="rTime">–</div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Tippe auf die Karte, um den Start zu setzen.</p>
      </div>

      <div class="actions">
        <button class="btn primary" id="calcBtn" type="button" disabled>Route berechnen</button>
        <button class="btn sq" id="shareBtn" type="button" disabled aria-label="Als GPX teilen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8.5 6.5 12 3l3.5 3.5"/><path d="M5 13v6a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19v-6"/></svg>
        </button>
        <button class="btn sq" id="saveBtn" type="button" disabled aria-label="Tour speichern">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.8A1.8 1.8 0 0 1 6.8 4h8.4L19 7.8v10.4A1.8 1.8 0 0 1 17.2 20H6.8A1.8 1.8 0 0 1 5 18.2z"/><path d="M8.4 4v5h6V4M8.4 20v-5.4h7.2V20"/></svg>
        </button>
      </div>

      <div id="analysis" hidden>
        <div class="card">
          <div class="cardhead"><h3>Höhenprofil</h3><span class="v" id="eleRange"></span></div>
          <svg class="chart" id="elev" viewBox="0 0 340 104" preserveAspectRatio="none" role="img"></svg>
          <div class="axisrow eyebrow"><span>0 km</span><span id="eleMid"></span><span id="eleEnd"></span></div>
        </div>

        <div class="card">
          <div class="cardhead"><h3>Bodenbeschaffenheit</h3><span class="v" id="surfSum"></span></div>
          <div class="bar" id="barSurface"></div>
          <div class="legend" id="legSurface"></div>
        </div>

        <div class="card">
          <div class="cardhead"><h3>Straßenarten</h3><span class="v" id="roadSum"></span></div>
          <div class="bar" id="barRoad"></div>
          <div class="legend" id="legRoad"></div>
        </div>

        <div class="flag" id="fastFlag" hidden>
          <span class="k num" id="fastPct"></span>
          <p id="fastText"></p>
        </div>
      </div>

      <p class="note attrib">
        Kartendaten © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende ·
        Routing über <a href="https://brouter.de">BRouter</a>
      </p>
    </div>
  </section>

  <!-- Ebene 3 -->
  <section class="screen" id="editor" aria-label="Routing-Profil">
    <div class="nav">
      <button class="txtbtn" id="editorDone" type="button">Fertig</button>
      <h2 id="editorTitle">Profil</h2>
      <button class="txtbtn" id="toKit" type="button">Baukasten</button>
    </div>
    <p class="editnote" id="editorNote" hidden></p>
    <div class="screenscroll flush" id="editorBody"></div>
  </section>

  <section class="screen" id="kit" aria-label="Baukasten">
    <div class="nav">
      <button class="txtbtn" id="kitBack" type="button">Zurück</button>
      <h2>Baukasten</h2>
      <span class="navpad"></span>
    </div>
    <div class="screenscroll" id="kitBody"></div>
  </section>

  <section class="screen" id="user" aria-label="Fahrer und Rad">
    <div class="nav">
      <button class="txtbtn" data-close="user" type="button">Fertig</button>
      <h2>Fahrer &amp; Rad</h2>
      <span class="navpad"></span>
    </div>
    <div class="screenscroll" id="userBody"></div>
  </section>

  <section class="screen" id="archive" aria-label="Touren">
    <div class="nav">
      <button class="txtbtn" data-close="archive" type="button">Fertig</button>
      <h2>Touren</h2>
      <span class="navpad"></span>
    </div>
    <div class="screenscroll" id="archiveBody"></div>
  </section>

  <section class="screen" id="backup" aria-label="Sicherung">
    <div class="nav">
      <button class="txtbtn" data-close="backup" type="button">Fertig</button>
      <h2>Sicherung</h2>
      <span class="navpad"></span>
    </div>
    <div class="screenscroll" id="backupBody"></div>
  </section>

  <section class="screen" id="allprofiles" aria-label="Alle Profile">
    <div class="nav">
      <button class="txtbtn" data-close="allprofiles" type="button">Fertig</button>
      <h2>Profile</h2>
      <button class="txtbtn" id="newProfile" type="button">Neu</button>
    </div>
    <div class="screenscroll" id="allBody"></div>
  </section>

  <!-- Ebene 2 -->
  <div class="scrim" id="scrim"></div>

  <div class="menu" id="profiles" aria-label="Profilauswahl">
    <div class="grab"><span></span></div>
    <div class="menuhead"><h3>Routing-Profil</h3><span class="cnt" id="pCount"></span></div>
    <div id="pList"></div>
    <button class="pmore" id="pMore" type="button">Mehr Profile <span id="pRest"></span></button>
    <p class="note" id="pTip"></p>
    <button class="btn wide" id="pDone" type="button">Fertig</button>
  </div>

  <div class="menu" id="menu" aria-label="Menü">
    <div class="grab"><span></span></div>
    <button class="menuitem" data-go="archive" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><circle cx="8" cy="6.5" r="1.6"/><circle cx="14" cy="12" r="1.6"/><circle cx="10" cy="17.5" r="1.6"/></svg>
      <span class="mt"><b>Touren</b><span id="miTours">–</span></span>
    </button>
    <button class="menuitem" data-go="user" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
      <span class="mt"><b>Fahrer &amp; Rad</b><span>Gewicht, Leistung — nur für die Zeitschätzung</span></span>
    </button>
    <button class="menuitem" data-go="backup" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 11.5l4 4 4-4"/><path d="M4 17v2.4A1.6 1.6 0 0 0 5.6 21h12.8a1.6 1.6 0 0 0 1.6-1.6V17"/></svg>
      <span class="mt"><b>Sicherung</b><span id="miBackup">Alles in eine Datei</span></span>
    </button>
  </div>

  <div class="menu" id="savedlg" aria-label="Profil sichern">
    <div class="grab"><span></span></div>
    <div class="menuhead"><h3>Profil sichern</h3></div>
    <p class="note" id="saveHint"></p>
    <input type="text" id="saveName" maxlength="40" autocomplete="off" aria-label="Name des Profils">
    <div class="actions two">
      <button class="btn" id="saveCancel" type="button">Änderungen verwerfen</button>
      <button class="btn primary" id="saveNew" type="button">Als neues sichern</button>
    </div>
    <button class="btn wide" id="saveOver" type="button">Bestehendes überschreiben</button>
  </div>

  <div class="menu" id="namedlg" aria-label="Name">
    <div class="grab"><span></span></div>
    <div class="menuhead"><h3 id="nameHead">Name</h3></div>
    <p class="note" id="nameHint"></p>
    <input type="text" id="nameInput" maxlength="60" autocomplete="off" aria-label="Name">
    <div class="actions two">
      <button class="btn" id="nameCancel" type="button">Abbrechen</button>
      <button class="btn primary" id="nameOk" type="button">Speichern</button>
    </div>
  </div>

  <div class="menu" id="confirmdlg" aria-label="Bestätigen">
    <div class="grab"><span></span></div>
    <div class="menuhead"><h3 id="confirmHead">Löschen</h3></div>
    <p class="note" id="confirmText"></p>
    <div class="actions two">
      <button class="btn" id="confirmCancel" type="button">Abbrechen</button>
      <button class="btn danger" id="confirmOk" type="button">Löschen</button>
    </div>
  </div>
</div>

<input id="importFile" type="file" accept="application/json,.json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>
<script src="params.js"></script>
<script src="app.js"></script>
</body>
</html>
